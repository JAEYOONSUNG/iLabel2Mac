name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package DMG
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          export APP_VERSION="${APP_VERSION#v}"
          ./scripts/package_dmg.sh

      - name: Upload DMG to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/iLabel-Studio-macOS.dmg

  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            targets: --win nsis portable --x64
          - name: Linux x64
            os: ubuntu-22.04
            targets: --linux AppImage deb --x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop

    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stamp the tag's version
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Test
        run: npm test

      - name: Build, package, and publish to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npx electron-builder ${{ matrix.targets }} --publish always
